<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="350" fill="#fff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">16 MB flash: two app slots</text>
<rect x="22.1" y="80" width="6.0" height="70" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="1.5"/>
<rect x="23.0" y="80" width="6.0" height="70" fill="#fffbe6" stroke="#e0c96b" stroke-width="1.5"/>
<rect x="23.5" y="80" width="6.0" height="70" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="1.5"/>
<rect x="27.5" y="80" width="296.2" height="70" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="1.5"/>
<text x="175.625" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#111">ota_0</text>
<text x="175.625" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#444">StackChan, until the first update</text>
<text x="29.5" y="168" text-anchor="start" font-size="11" font-weight="400" fill="#6b7787">0x020000</text>
<rect x="323.8" y="80" width="296.2" height="70" fill="#fff4e8" stroke="#f08a24" stroke-width="1.5"/>
<text x="471.875" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#111">ota_1</text>
<text x="471.875" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#444">botstack</text>
<text x="325.75" y="168" text-anchor="start" font-size="11" font-weight="400" fill="#6b7787">0x510000</text>
<rect x="620.0" y="80" width="240.0" height="70" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="1.5"/>
<text x="740.0" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#111">assets</text>
<text x="740.0" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="#444">StackChan assets</text>
<text x="622.0" y="168" text-anchor="start" font-size="11" font-weight="400" fill="#6b7787">0xA00000</text>
<rect x="860.0" y="80" width="6.0" height="70" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="1.5"/>
<text x="22.109375" y="72" text-anchor="start" font-size="11" font-weight="400" fill="#6b7787">nvs · otadata · phy</text>
<line x1="383.75" y1="210" x2="383.75" y2="156" stroke="#f08a24" stroke-width="2" marker-end="url(#a)"/>
<text x="393.75" y="205" text-anchor="start" font-size="13" font-weight="700" fill="#b25f10">./flash.sh botstack writes only ota_1 + otadata</text>
<line x1="53.046875" y1="250" x2="26.046875" y2="156" stroke="#e0c96b" stroke-width="2" marker-end="url(#a)"/>
<text x="63.046875" y="248" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b5a10">otadata picks the app; ./flash.sh stackchan or a 3 s press switches back to ota_0 while StackChan is there</text>
<text x="20" y="290" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">An update over the air goes to the slot that is not running: the first one replaces StackChan, then the two slots alternate.</text>
<text x="20" y="310" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">Never written: the bootloader, the partition table, NVS (Wi-Fi credentials, servo zero offsets) and assets.</text>
<text x="20" y="330" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">An updated app that has not reached the bridge yet is rolled back to the other slot on the next reset.</text>
</svg>
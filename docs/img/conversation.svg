<text x="645.0" y="499.0" text-anchor="middle" font-size="12" fill="#222">speech_stopped (server VAD)</text>
<line x1="472" y1="548" x2="158" y2="548" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

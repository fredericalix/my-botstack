<text x="150" y="251" text-anchor="middle" font-size="13" font-weight="400" fill="#6b5a10">User taps the screen or the head</text>
<line x1="158" y1="296" x2="472" y2="296" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

<text x="315.0" y="751.0" text-anchor="middle" font-size="12" fill="#222">state listening</text>
<rect x="370" y="778" width="220" height="28" rx="8" fill="#fffbe6" stroke="#e0c96b"/>
<text x="480" y="797" text-anchor="middle" font-size="13" font-weight="400" fill="#6b5a10">40 s without speech</text>
<line x1="488" y1="842" x2="802" y2="842" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
<text x="645.0" y="835.0" text-anchor="middle" font-size="12" fill="#222">close the session</text>
<line x1="472" y1="884" x2="158" y2="884" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
<text x="315.0" y="877.0" text-anchor="middle" font-size="12" fill="#222">animation sleep · state idle (the WebSocket stays open)</text>

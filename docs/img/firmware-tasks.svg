<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="640" fill="#fff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Firmware: tasks on the two cores</text>
<rect x="20" y="70" width="470" height="40" rx="12" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="2"/>
<text x="255.0" y="95.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Core 0</text>
<rect x="510" y="70" width="470" height="40" rx="12" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="2"/>
<text x="745.0" y="95.0" text-anchor="middle" font-size="15" font-weight="700" fill="#111">Core 1</text>
<rect x="20" y="125" width="470" height="48" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="255.0" y="138.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">LVGL</text>
<text x="255.0" y="157.5" text-anchor="middle" font-size="12" fill="#444">the bloub face, 30 fps, small redraws</text>
<rect x="20" y="183" width="470" height="48" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="255.0" y="196.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">playback (prio 9)</text>
<text x="255.0" y="215.5" text-anchor="middle" font-size="12" fill="#444">speaker queue → I2S, silence when idle</text>
<rect x="20" y="241" width="470" height="48" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="255.0" y="254.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">voice</text>
<text x="255.0" y="273.5" text-anchor="middle" font-size="12" fill="#444">Opus decode 24 kHz</text>
<rect x="20" y="299" width="470" height="48" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="255.0" y="312.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">mic_send</text>
<text x="255.0" y="331.5" text-anchor="middle" font-size="12" fill="#444">Opus encode 16 kHz + TLS write (25.7 kB of stack used)</text>
<rect x="20" y="357" width="470" height="48" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="255.0" y="370.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">link</text>
<text x="255.0" y="389.5" text-anchor="middle" font-size="12" fill="#444">botstack/v1, state from the bridge; 20 s without a frame → restart</text>
<rect x="20" y="415" width="470" height="48" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="255.0" y="428.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">WebSocket + Wi-Fi</text>
<text x="255.0" y="447.5" text-anchor="middle" font-size="12" fill="#444">esp_websocket_client (ping 5 s), lwIP, mbedTLS</text>
<rect x="20" y="473" width="470" height="48" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="255.0" y="486.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">head</text>
<text x="255.0" y="505.5" text-anchor="middle" font-size="12" fill="#444">servos at 50 Hz, torque off at rest; missing at boot: retried every 10 s</text>
<rect x="20" y="531" width="470" height="48" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="255.0" y="544.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">camera (prio 3)</text>
<text x="255.0" y="563.5" text-anchor="middle" font-size="12" fill="#444">photo → JPEG → HTTPS upload, shutter click</text>
<rect x="510" y="125" width="470" height="48" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="745.0" y="138.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">capture (prio 8)</text>
<text x="745.0" y="157.5" text-anchor="middle" font-size="12" fill="#444">I2S read mic + reference, 24 → 16 kHz</text>
<rect x="510" y="183" width="470" height="48" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="745.0" y="196.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">afe_fetch</text>
<text x="745.0" y="215.5" text-anchor="middle" font-size="12" fill="#444">ESP-SR AFE: echo canceller, voice detection, AGC</text>
<rect x="510" y="241" width="470" height="48" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="745.0" y="254.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">touch (prio 5)</text>
<text x="745.0" y="273.5" text-anchor="middle" font-size="12" fill="#444">head touch (Si12T) every 50 ms = a tap</text>
<rect x="510" y="320" width="470" height="110" rx="12" fill="#fffbe6" stroke="#e0c96b" stroke-width="2"/>
<text x="745.0" y="339.0" text-anchor="middle" font-size="13" font-weight="700" fill="#6b5a10">Why this split</text>
<text x="745.0" y="358.0" text-anchor="middle" font-size="12" fill="#6b5a10">The AFE fills most of core 1; encoding there starved it.</text>
<text x="745.0" y="375.0" text-anchor="middle" font-size="12" fill="#6b5a10">Internal RAM is scarce: task stacks of our audio and</text>
<text x="745.0" y="392.0" text-anchor="middle" font-size="12" fill="#6b5a10">link tasks live in PSRAM; Wi-Fi, lwIP and TLS</text>
<text x="745.0" y="409.0" text-anchor="middle" font-size="12" fill="#6b5a10">buffers too. Display buffers are 40 lines.</text>
<text x="20" y="620" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">Orange: audio, face, head, camera and touch. Blue: network. All Opus work uses esp_audio_codec; resampling is our own polyphase filter.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="470" fill="#fff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">An update over the air</text>
<rect x="20" y="80" width="200" height="86" rx="12" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="2"/>
<text x="120.0" y="95.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Your computer</text>
<text x="120.0" y="114.5" text-anchor="middle" font-size="12" fill="#444">scripts/publish-firmware.sh</text>
<text x="120.0" y="131.5" text-anchor="middle" font-size="12" fill="#444">build, signed with</text>
<text x="120.0" y="148.5" text-anchor="middle" font-size="12" fill="#444">signing-key.pem</text>
<rect x="290" y="80" width="220" height="86" rx="12" fill="#eef8f0" stroke="#2e9e5b" stroke-width="2"/>
<text x="400.0" y="104.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Bridge /data</text>
<text x="400.0" y="123.0" text-anchor="middle" font-size="12" fill="#2b6b43">firmware/botstack-fw.bin</text>
<text x="400.0" y="140.0" text-anchor="middle" font-size="12" fill="#2b6b43">build = ELF SHA-256, 8 bytes</text>
<rect x="580" y="80" width="400" height="86" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="780.0" y="104.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Robot, running build A</text>
<text x="780.0" y="123.0" text-anchor="middle" font-size="12" fill="#444">gets firmware {build B, url}: not its own,</text>
<text x="780.0" y="140.0" text-anchor="middle" font-size="12" fill="#444">not rolled back before → waits for a pause</text>
<line x1="222" y1="123" x2="288" y2="123" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="255.0" y="117.0" text-anchor="middle" font-size="12" fill="#222">copy</text>
<line x1="512" y1="123" x2="578" y2="123" stroke="#2f6fdf" stroke-width="2" marker-end="url(#a)"/>
<text x="545.0" y="117.0" text-anchor="middle" font-size="12" fill="#222">≤ 30 s</text>
<rect x="580" y="210" width="400" height="76" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="780.0" y="229.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Idle, nothing playing</text>
<text x="780.0" y="248.0" text-anchor="middle" font-size="12" fill="#444">sleepy face, taps ignored; GET /botstack/v1/firmware</text>
<text x="780.0" y="265.0" text-anchor="middle" font-size="12" fill="#444">with its key → the other app slot</text>
<line x1="780" y1="168" x2="780" y2="208" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="580" y="330" width="190" height="86" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="675.0" y="354.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Signature OK</text>
<text x="675.0" y="373.0" text-anchor="middle" font-size="12" fill="#444">signed with the key</text>
<text x="675.0" y="390.0" text-anchor="middle" font-size="12" fill="#444">of build A: boot B</text>
<rect x="790" y="330" width="190" height="86" rx="12" fill="#fffbe6" stroke="#e0c96b" stroke-width="2"/>
<text x="885.0" y="354.0" text-anchor="middle" font-size="13" font-weight="700" fill="#6b5a10">Signature wrong</text>
<text x="885.0" y="373.0" text-anchor="middle" font-size="12" fill="#6b5a10">image refused, A keeps</text>
<text x="885.0" y="390.0" text-anchor="middle" font-size="12" fill="#6b5a10">running; B not retried</text>
<line x1="700" y1="288" x2="675" y2="328" stroke="#2e9e5b" stroke-width="2" marker-end="url(#a)"/>
<line x1="860" y1="288" x2="885" y2="328" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
<rect x="290" y="330" width="230" height="86" rx="12" fill="#eef8f0" stroke="#2e9e5b" stroke-width="2"/>
<text x="405.0" y="354.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">B says hello to the bridge</text>
<text x="405.0" y="373.0" text-anchor="middle" font-size="12" fill="#2b6b43">marks itself valid:</text>
<text x="405.0" y="390.0" text-anchor="middle" font-size="12" fill="#2b6b43">B stays</text>
<rect x="20" y="330" width="230" height="86" rx="12" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="2"/>
<text x="135.0" y="354.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">B crashes or never connects</text>
<text x="135.0" y="373.0" text-anchor="middle" font-size="12" fill="#444">next reset boots A again;</text>
<text x="135.0" y="390.0" text-anchor="middle" font-size="12" fill="#444">A will not install B again</text>
<line x1="578" y1="372" x2="522" y2="372" stroke="#2e9e5b" stroke-width="2" marker-end="url(#a)"/>
<text x="550.0" y="364.0" text-anchor="middle" font-size="12" fill="#222">hello</text>
<polyline points="675,418 675,444 135,444 135,418" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="405" y="462" text-anchor="middle" font-size="12" font-weight="400" fill="#c0392b">otherwise</text>
<text x="20" y="205" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">First time: the USB flash installs a signed</text>
<text x="20" y="223" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">firmware, and with it the key the robot trusts.</text>
<text x="20" y="249" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">The first update overwrites StackChan in ota_0;</text>
<text x="20" y="267" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">then the two slots hold the new and the previous</text>
<text x="20" y="285" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">botstack.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="470" fill="#fff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">The bloub face: eyes on a sphere</text>
<circle cx="250" cy="260" r="150" fill="#f08a24"/>
<ellipse cx="250" cy="260" rx="93.0" ry="150" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<ellipse cx="250" cy="260" rx="150" ry="93.0" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<ellipse cx="250" cy="260" rx="48.0" ry="150" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<ellipse cx="250" cy="260" rx="150" ry="48.0" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<ellipse cx="250" cy="260" rx="2" ry="150" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<ellipse cx="250" cy="260" rx="150" ry="2" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<ellipse cx="250" cy="260" rx="48.0" ry="150" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<ellipse cx="250" cy="260" rx="150" ry="48.0" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<ellipse cx="250" cy="260" rx="93.0" ry="150" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<ellipse cx="250" cy="260" rx="150" ry="93.0" fill="none" stroke="#ffd2a8" stroke-width="1" stroke-dasharray="4 5"/>
<rect x="268" y="165" width="22" height="50" rx="11" fill="#f9f9f9" transform="rotate(-25 279 190)"/>
<rect x="325" y="152" width="16" height="46" rx="8" fill="#f9f9f9" transform="rotate(-25 333 175)"/>
<line x1="250" y1="260" x2="290" y2="190" stroke="#16181d" stroke-width="2" marker-end="url(#a)"/>
<text x="244" y="282" text-anchor="end" font-size="13" font-weight="700" fill="#fff">gaze</text>
<text x="244" y="298" text-anchor="end" font-size="11" font-weight="400" fill="#fff">yaw · pitch · roll</text>
<text x="450" y="110" text-anchor="start" font-size="14" font-weight="700" fill="#111">Gaze (yaw, pitch, roll)</text>
<text x="450" y="128" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">turns both eyes around the sphere; neutral looks up and right</text>
<text x="450" y="156" text-anchor="start" font-size="14" font-weight="700" fill="#111">Split</text>
<text x="450" y="174" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">angle between the two eyes on the sphere (≈ 14–20°)</text>
<text x="450" y="202" text-anchor="start" font-size="14" font-weight="700" fill="#111">Per eye: w, h</text>
<text x="450" y="220" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">size of a rounded rectangle, as a fraction of the radius</text>
<text x="450" y="248" text-anchor="start" font-size="14" font-weight="700" fill="#111">Per eye: tilt</text>
<text x="450" y="266" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">rotation in the eye's own plane (anger, sadness…)</text>
<text x="450" y="294" text-anchor="start" font-size="14" font-weight="700" fill="#111">Per eye: open</text>
<text x="450" y="312" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">eyelid; blinks squash it to 6 %</text>
<text x="450" y="340" text-anchor="start" font-size="14" font-weight="700" fill="#111">Depth</text>
<text x="450" y="358" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">an eye turning away fades out</text>
<text x="450" y="386" text-anchor="start" font-size="14" font-weight="700" fill="#111">At rest</text>
<text x="450" y="404" text-anchor="start" font-size="12.5" font-weight="400" fill="#444">slow wander (3 harmonics) and blinks every 2–5 s</text>
</svg>
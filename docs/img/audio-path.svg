<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="1000" height="470" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">The audio path</text>
<text x="20" y="72" font-size="16" font-weight="700" fill="#b25f10">Uplink: your voice to Grok</text>
<rect x="20.0" y="90" width="145.0" height="112" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="92.5" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Microphone</text>
<text x="92.5" y="142" text-anchor="middle" font-size="11.5" fill="#444">ES7210 ADC</text>
<text x="92.5" y="160" text-anchor="middle" font-size="11.5" fill="#444">24 kHz, the</text>
<text x="92.5" y="178" text-anchor="middle" font-size="11.5" fill="#444">microphone channel</text>
<line x1="167.0" y1="146" x2="181.0" y2="146" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="183.0" y="90" width="145.0" height="112" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="255.5" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Resample</text>
<text x="255.5" y="142" text-anchor="middle" font-size="11.5" fill="#444">24 → 16 kHz</text>
<text x="255.5" y="160" text-anchor="middle" font-size="11.5" fill="#444">polyphase filter</text>
<line x1="330.0" y1="146" x2="344.0" y2="146" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="346.0" y="90" width="145.0" height="112" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="418.5" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">ESP-SR AFE</text>
<text x="418.5" y="142" text-anchor="middle" font-size="11.5" fill="#444">echo canceller</text>
<text x="418.5" y="160" text-anchor="middle" font-size="11.5" fill="#444">(ref: what plays)</text>
<text x="418.5" y="178" text-anchor="middle" font-size="11.5" fill="#444">voice detection, gain</text>
<line x1="493.0" y1="146" x2="507.0" y2="146" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="509.0" y="90" width="145.0" height="112" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="581.5" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Opus encode</text>
<text x="581.5" y="142" text-anchor="middle" font-size="11.5" fill="#444">16 kHz mono</text>
<text x="581.5" y="160" text-anchor="middle" font-size="11.5" fill="#444">60 ms per packet</text>
<text x="581.5" y="178" text-anchor="middle" font-size="11.5" fill="#444">≈ 24 kbit/s</text>
<line x1="656.0" y1="146" x2="670.0" y2="146" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="672.0" y="90" width="145.0" height="112" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="744.5" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Bridge decode</text>
<text x="744.5" y="142" text-anchor="middle" font-size="11.5" fill="#444">Opus → PCM</text>
<text x="744.5" y="160" text-anchor="middle" font-size="11.5" fill="#444">16 kHz</text>
<line x1="819.0" y1="146" x2="833.0" y2="146" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="835.0" y="90" width="145.0" height="112" rx="12" fill="#16181d" stroke="#16181d" stroke-width="2"/>
<text x="907.5" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">xAI realtime</text>
<text x="907.5" y="142" text-anchor="middle" font-size="11.5" fill="#cfd5df">listens, detects</text>
<text x="907.5" y="160" text-anchor="middle" font-size="11.5" fill="#cfd5df">the end of the turn</text>
<text x="20" y="272" font-size="16" font-weight="700" fill="#2f6fdf">Downlink: Grok's voice to the speaker</text>
<rect x="20.0" y="290" width="145.0" height="112" rx="12" fill="#16181d" stroke="#16181d" stroke-width="2"/>
<text x="92.5" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">xAI realtime</text>
<text x="92.5" y="342" text-anchor="middle" font-size="11.5" fill="#cfd5df">PCM 24 kHz</text>
<text x="92.5" y="360" text-anchor="middle" font-size="11.5" fill="#cfd5df">in bursts</text>
<line x1="167.0" y1="346" x2="181.0" y2="346" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="183.0" y="290" width="145.0" height="112" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="255.5" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Voice shaping</text>
<text x="255.5" y="342" text-anchor="middle" font-size="11.5" fill="#444">high-pass 300 Hz</text>
<text x="255.5" y="360" text-anchor="middle" font-size="11.5" fill="#444">+10 dB at 3 kHz</text>
<text x="255.5" y="378" text-anchor="middle" font-size="11.5" fill="#444">limiter −10 dBFS</text>
<line x1="330.0" y1="346" x2="344.0" y2="346" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="346.0" y="290" width="145.0" height="112" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="418.5" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Opus encode</text>
<text x="418.5" y="342" text-anchor="middle" font-size="11.5" fill="#444">24 kHz, 60 ms</text>
<text x="418.5" y="360" text-anchor="middle" font-size="11.5" fill="#444">64 kbit/s constant</text>
<line x1="493.0" y1="346" x2="507.0" y2="346" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="509.0" y="290" width="145.0" height="112" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="581.5" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Pacing</text>
<text x="581.5" y="342" text-anchor="middle" font-size="11.5" fill="#444">≤ 4 packets ahead</text>
<text x="581.5" y="360" text-anchor="middle" font-size="11.5" fill="#444">1 every 60 ms</text>
<line x1="656.0" y1="346" x2="670.0" y2="346" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="672.0" y="290" width="145.0" height="112" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="744.5" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Opus decode</text>
<text x="744.5" y="342" text-anchor="middle" font-size="11.5" fill="#444">24 kHz on</text>
<text x="744.5" y="360" text-anchor="middle" font-size="11.5" fill="#444">the robot</text>
<line x1="819.0" y1="346" x2="833.0" y2="346" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="835.0" y="290" width="145.0" height="112" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="907.5" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111">Speaker</text>
<text x="907.5" y="342" text-anchor="middle" font-size="11.5" fill="#444">AW88298 amp</text>
<text x="907.5" y="360" text-anchor="middle" font-size="11.5" fill="#444">24 kHz</text>
<rect x="20" y="425" width="14" height="14" rx="3" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/><text x="42" y="437" font-size="12" fill="#444">robot firmware</text>
<rect x="160" y="425" width="14" height="14" rx="3" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/><text x="182" y="437" font-size="12" fill="#444">botstack-bridge</text>
<rect x="310" y="425" width="14" height="14" rx="3" fill="#16181d"/><text x="332" y="437" font-size="12" fill="#444">xAI</text>
</svg>
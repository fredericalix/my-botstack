<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="1000" height="900" fill="#fff"/>
<text x="500.0" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Grok Bot: replies, pushes, photos and the lock</text>
<text x="20" y="72" text-anchor="start" font-size="15" font-weight="700" fill="#5b3cc4">A. You ask something only Grok Bot can see</text>
<rect x="20" y="90" width="170" height="80" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="105.0" y="111.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111">You</text>
<text x="105.0" y="130.0" text-anchor="middle" font-size="12" fill="#444">“What is on my</text>
<text x="105.0" y="147.0" text-anchor="middle" font-size="12" fill="#444">calendar today?”</text>
<rect x="230" y="90" width="190" height="80" rx="12" fill="#16181d" stroke="#16181d" stroke-width="2"/>
<text x="325.0" y="111.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Realtime voice</text>
<text x="325.0" y="130.0" text-anchor="middle" font-size="12" fill="#cfd5df">calls ask_grok_bot,</text>
<text x="325.0" y="147.0" text-anchor="middle" font-size="12" fill="#cfd5df">says it is asking</text>
<rect x="460" y="90" width="170" height="80" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="545.0" y="111.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Bridge</text>
<text x="545.0" y="130.0" text-anchor="middle" font-size="12" fill="#444">POST webhook</text>
<text x="545.0" y="147.0" text-anchor="middle" font-size="12" fill="#444">request_id + question</text>
<rect x="670" y="90" width="170" height="80" rx="12" fill="#f1ebff" stroke="#7c4dff" stroke-width="2"/>
<text x="755.0" y="111.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Grok Bot</text>
<text x="755.0" y="130.0" text-anchor="middle" font-size="12" fill="#5b3cc4">reads mail, calendar,</text>
<text x="755.0" y="147.0" text-anchor="middle" font-size="12" fill="#5b3cc4">accounts…</text>
<line x1="192" y1="130" x2="228" y2="130" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="422" y1="130" x2="458" y2="130" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="632" y1="130" x2="668" y2="130" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="755" y1="172" x2="755" y2="222" stroke="#7c4dff" stroke-width="2" marker-end="url(#a)"/>
<text x="747.0" y="193.0" text-anchor="end" font-size="12" fill="#222">MCP stackchan_reply</text>
<text x="747.0" y="208.0" text-anchor="end" font-size="12" fill="#222">(request_id, text)</text>
<rect x="560" y="225" width="280" height="60" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="700.0" y="260.0" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Bridge receives the answer</text>
<rect x="300" y="320" width="250" height="74" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="425.0" y="338.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Conversation still open</text>
<text x="425.0" y="357.0" text-anchor="middle" font-size="12" fill="#444">chime, then xAI TTS reads it</text>
<text x="425.0" y="374.0" text-anchor="middle" font-size="12" fill="#444">word for word (after any reply)</text>
<rect x="600" y="320" width="240" height="74" rx="12" fill="#eef8f0" stroke="#2e9e5b" stroke-width="2"/>
<text x="720.0" y="338.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Conversation closed</text>
<text x="720.0" y="357.0" text-anchor="middle" font-size="12" fill="#2b6b43">notify, chime, spoken at once;</text>
<text x="720.0" y="374.0" text-anchor="middle" font-size="12" fill="#2b6b43">offline: kept until reconnect</text>
<line x1="640" y1="287" x2="470" y2="318" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="555.0" y="300.5" text-anchor="middle" font-size="12" fill="#222">yes</text>
<line x1="720" y1="287" x2="720" y2="318" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="720.0" y="300.5" text-anchor="start" font-size="12" fill="#222">no</text>
<text x="20" y="452" text-anchor="start" font-size="15" font-weight="700" fill="#5b3cc4">B. A Grok Bot agent pushes a message on its own</text>
<rect x="20" y="470" width="210" height="70" rx="12" fill="#f1ebff" stroke="#7c4dff" stroke-width="2"/>
<text x="125.0" y="494.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">stackchan_say(text)</text>
<text x="125.0" y="513.5" text-anchor="middle" font-size="12" fill="#5b3cc4">any time, 30 per hour max</text>
<rect x="270" y="470" width="240" height="70" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="390.0" y="486.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Conversation open?</text>
<text x="390.0" y="505.0" text-anchor="middle" font-size="12" fill="#444">yes: wait for its end</text>
<text x="390.0" y="522.0" text-anchor="middle" font-size="12" fill="#444">no: spoken at once</text>
<rect x="550" y="470" width="290" height="70" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="695.0" y="494.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Notify, chime, then spoken</text>
<text x="695.0" y="513.5" text-anchor="middle" font-size="12" fill="#444">then listens 10 s for an answer</text>
<line x1="232" y1="505" x2="268" y2="505" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="512" y1="505" x2="548" y2="505" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="870" y="90" width="110" height="120" rx="12" fill="#f3f4f6" stroke="#9aa7b8" stroke-width="2"/>
<text x="925.0" y="105.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Limits</text>
<text x="925.0" y="124.5" text-anchor="middle" font-size="12" fill="#444">approved only</text>
<text x="925.0" y="141.5" text-anchor="middle" font-size="12" fill="#444">10 asks/h</text>
<text x="925.0" y="158.5" text-anchor="middle" font-size="12" fill="#444">30 pushes/h</text>
<text x="925.0" y="175.5" text-anchor="middle" font-size="12" fill="#444">20 photos/h</text>
<text x="925.0" y="192.5" text-anchor="middle" font-size="12" fill="#444">5 kept offline</text>
<text x="20" y="592" text-anchor="start" font-size="15" font-weight="700" fill="#5b3cc4">C. Grok Bot asks for a photo</text>
<rect x="20" y="610" width="170" height="74" rx="12" fill="#f1ebff" stroke="#7c4dff" stroke-width="2"/>
<text x="105.0" y="636.5" text-anchor="middle" font-size="13" font-weight="700" fill="#111">stackchan_photo</text>
<text x="105.0" y="655.5" text-anchor="middle" font-size="12" fill="#5b3cc4">20 per hour</text>
<rect x="230" y="610" width="210" height="74" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="335.0" y="628.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111">Bridge</text>
<text x="335.0" y="647.0" text-anchor="middle" font-size="12" fill="#444">tool camera.take_photo</text>
<text x="335.0" y="664.0" text-anchor="middle" font-size="12" fill="#444">question botstack-photo:‹key›</text>
<rect x="480" y="610" width="200" height="74" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="580.0" y="628.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Robot</text>
<text x="580.0" y="647.0" text-anchor="middle" font-size="12" fill="#444">eyes wide, shutter click,</text>
<text x="580.0" y="664.0" text-anchor="middle" font-size="12" fill="#444">JPEG 320×240</text>
<rect x="720" y="610" width="260" height="74" rx="12" fill="#eaf1ff" stroke="#2f6fdf" stroke-width="2"/>
<text x="850.0" y="628.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111">/mcp/vision/explain</text>
<text x="850.0" y="647.0" text-anchor="middle" font-size="12" fill="#444">sees the prefix: the JPEG goes</text>
<text x="850.0" y="664.0" text-anchor="middle" font-size="12" fill="#444">back to the waiting call</text>
<line x1="192" y1="647" x2="228" y2="647" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="442" y1="647" x2="478" y2="647" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="682" y1="647" x2="718" y2="647" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="700.0" y="641.0" text-anchor="middle" font-size="12" fill="#222">upload</text>
<polyline points="850,686 850,712 105,712 105,688" fill="none" stroke="#7c4dff" stroke-width="2" marker-end="url(#a)"/>
<text x="478" y="730" text-anchor="middle" font-size="12" font-weight="400" fill="#5b3cc4">MCP image content (image/jpeg), shown in Grok Bot · error after 30 s or when the robot is offline</text>
<text x="20" y="782" text-anchor="start" font-size="15" font-weight="700" fill="#5b3cc4">D. Lock the robot</text>
<rect x="20" y="800" width="210" height="80" rx="12" fill="#f1ebff" stroke="#7c4dff" stroke-width="2"/>
<text x="125.0" y="821.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">stackchan_lock</text>
<text x="125.0" y="840.0" text-anchor="middle" font-size="12" fill="#5b3cc4">or fleet_lock</text>
<text x="125.0" y="857.0" text-anchor="middle" font-size="12" fill="#5b3cc4">on · off · status</text>
<rect x="270" y="800" width="210" height="80" rx="12" fill="#eef8f0" stroke="#2e9e5b" stroke-width="2"/>
<text x="375.0" y="821.0" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Bridge</text>
<text x="375.0" y="840.0" text-anchor="middle" font-size="12" fill="#2b6b43">saves fleet.json:</text>
<text x="375.0" y="857.0" text-anchor="middle" font-size="12" fill="#2b6b43">a restart keeps it</text>
<rect x="520" y="800" width="220" height="80" rx="12" fill="#fff4e8" stroke="#f08a24" stroke-width="2"/>
<text x="630.0" y="821.0" text-anchor="middle" font-size="12" font-weight="700" fill="#111">Locked robot</text>
<text x="630.0" y="840.0" text-anchor="middle" font-size="12" fill="#444">wary face (mefiant), open</text>
<text x="630.0" y="857.0" text-anchor="middle" font-size="12" fill="#444">conversation closed, taps → alert</text>
<rect x="780" y="800" width="200" height="80" rx="12" fill="#fffbe6" stroke="#e0c96b" stroke-width="2"/>
<text x="880.0" y="821.0" text-anchor="middle" font-size="12" font-weight="700" fill="#6b5a10">Still works</text>
<text x="880.0" y="840.0" text-anchor="middle" font-size="12" fill="#6b5a10">Grok Bot replies and pushes</text>
<text x="880.0" y="857.0" text-anchor="middle" font-size="12" fill="#6b5a10">(no listen after), photos</text>
<line x1="232" y1="840" x2="268" y2="840" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="482" y1="840" x2="518" y2="840" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
</svg>